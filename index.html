<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>A-Frame Escape Room</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

  <a-scene>

    <!-- ============================================================
         PROCEDURAL TEXTURES
         Drawn on hidden <canvas> elements with plain JS so the whole
         scene works from this one file with no external image files.
    ============================================================= -->
    <a-assets>
      <canvas id="woodFloorCanvas" width="256" height="256"></canvas>
      <canvas id="woodDarkCanvas" width="256" height="256"></canvas>
      <canvas id="wallPaintCanvas" width="256" height="256"></canvas>
      <canvas id="metalCanvas" width="256" height="256"></canvas>
      <canvas id="paperCanvas" width="256" height="256"></canvas>
    </a-assets>

    <script>
      (function () {
        function paint(id, fn) {
          var c = document.getElementById(id);
          var ctx = c.getContext('2d');
          fn(ctx, c.width, c.height);
        }
        function drawWood(ctx, w, h, base, dark) {
          ctx.fillStyle = base;
          ctx.fillRect(0, 0, w, h);
          for (var i = 0; i < 12; i++) {
            ctx.globalAlpha = 0.15;
            ctx.fillStyle = (i % 2) ? dark : base;
            ctx.fillRect(0, i * (h / 12), w, h / 24);
          }
          ctx.globalAlpha = 0.08;
          ctx.strokeStyle = dark;
          for (var j = 0; j < 24; j++) {
            ctx.beginPath();
            ctx.moveTo(Math.random() * w, 0);
            ctx.lineTo(Math.random() * w, h);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
        function drawWall(ctx, w, h) {
          ctx.fillStyle = '#e9e1c9';
          ctx.fillRect(0, 0, w, h);
          ctx.fillStyle = '#cabf9c';
          ctx.fillRect(0, h * 0.76, w, h * 0.04);
          ctx.fillStyle = '#d7ba8c';
          ctx.fillRect(0, h * 0.80, w, h * 0.20);
          ctx.strokeStyle = '#d3c8a9';
          ctx.globalAlpha = 0.4;
          for (var x = 0; x < w; x += w / 4) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, h * 0.76);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
        function drawMetal(ctx, w, h) {
          var grad = ctx.createLinearGradient(0, 0, 0, h);
          grad.addColorStop(0, '#d3d8db');
          grad.addColorStop(0.5, '#9aa2a8');
          grad.addColorStop(1, '#7d858b');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, w, h);
          ctx.strokeStyle = '#ffffff';
          for (var i = 0; i < 50; i++) {
            ctx.globalAlpha = 0.05;
            var y = Math.random() * h;
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(w, y);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
