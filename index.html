<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>A-Frame Room Test</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

  <a-scene>

    <!-- Camera rig with cursor for click interaction -->
    <a-entity id="rig" position="0 0 0">
      <a-entity id="cameraEl" camera look-controls wasd-controls position="0 1.6 0">
        <a-entity cursor="fuse: false"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02"
          material="color: #FFF; shader: flat"
          raycaster="objects: .clickable; far: 20">
        </a-entity>

        <!-- Held key: hidden until picked up, follows the camera like a first-person item -->
        <a-entity id="heldKey" visible="false" position="0.35 -0.25 -0.6" rotation="0 0 90" scale="1.4 1.4 1.4">
          <a-torus color="#d4af37" radius="0.08" radius-tubular="0.015" segments-tubular="16"></a-torus>
          <a-box color="#d4af37" width="0.02" height="0.25" depth="0.02" position="0 -0.16 0"></a-box>
          <a-box color="#d4af37" width="0.06" height="0.03" depth="0.02" position="0.03 -0.24 0"></a-box>
          <a-box color="#d4af37" width="0.06" height="0.03" depth="0.02" position="0.03 -0.3 0"></a-box>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Table (center of room) -->
    <a-box
      position="0 0.9 -4"
      width="2"
      height="0.1"
      depth="1"
      color="#5c3a21">
    </a-box>
    <a-box position="0.9 0.45 -3.6" width="0.1" height="0.9" depth="0.1" color="#3e2712"></a-box>
    <a-box position="-0.9 0.45 -3.6" width="0.1" height="0.9" depth="0.1" color="#3e2712"></a-box>
    <a-box position="0.9 0.45 -4.4" width="0.1" height="0.9" depth="0.1" color="#3e2712"></a-box>
    <a-box position="-0.9 0.45 -4.4" width="0.1" height="0.9" depth="0.1" color="#3e2712"></a-box>

    <!-- Key (lying flat on the table, click to pick up) -->
    <a-entity id="key" position="0 0.965 -4">
      <!-- Invisible hitbox: the visual pieces below have no geometry of their own on the
           parent entity, so this box is the actual clickable target the raycaster hits -->
      <a-box id="keyHitbox" class="clickable" position="0 0 -0.1" width="0.4" height="0.05" depth="0.55"
        material="opacity: 0; transparent: true">
      </a-box>
      <a-torus color="#d4af37" radius="0.08" radius-tubular="0.015" segments-tubular="16" rotation="90 0 0"></a-torus>
      <a-box color="#d4af37" width="0.02" height="0.02" depth="0.25" position="0 0 -0.16"></a-box>
      <a-box color="#d4af37" width="0.06" height="0.02" depth="0.03" position="0.03 0 -0.24"></a-box>
      <a-box color="#d4af37" width="0.06" height="0.02" depth="0.03" position="0.03 0 -0.3"></a-box>
    </a-entity>

    <!-- Floor (wood brown) -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#8B5A2B">
    </a-plane>

    <!-- Ceiling (brick) -->
    <a-plane
      position="0 6 -4"
      rotation="90 0 0"
      width="20"
      height="20"
      color="#a94442">
    </a-plane>

    <!-- Walls (room is 20x20, 6 units tall, centered on the floor at 0,0,-4) -->

    <!-- North wall (far) -->
    <a-plane
      position="0 3 -14"
      rotation="0 0 0"
      width="20"
      height="6"
      color="#a94442">
    </a-plane>
    <a-plane position="-6 4 -13.9" rotation="0 0 0" width="2" height="3" color="#f5f0e6"></a-plane>
    <a-text value="Poster 1" position="-6 4 -13.85" rotation="0 0 0" align="center" color="#333" width="2.5"></a-text>
    <a-plane position="6 2.5 -13.9" rotation="0 0 0" width="2" height="3" color="#f5f0e6"></a-plane>
    <a-text value="Poster 2" position="6 2.5 -13.85" rotation="0 0 0" align="center" color="#333" width="2.5"></a-text>

    <!-- South wall (near, behind viewer's start) with the door -->
    <a-plane
      position="0 3 6"
      rotation="0 180 0"
      width="20"
      height="6"
      color="#a94442">
    </a-plane>
    <a-plane position="-6 2.5 5.9" rotation="0 180 0" width="2" height="3" color="#f5f0e6"></a-plane>
    <a-text value="Poster 3" position="-6 2.5 5.85" rotation="0 180 0" align="center" color="#333" width="2.5"></a-text>
    <a-plane position="6 4 5.9" rotation="0 180 0" width="2" height="3" color="#f5f0e6"></a-plane>
    <a-text value="Poster 4" position="6 4 5.85" rotation="0 180 0" align="center" color="#333"
